# Kernel / system
CONFIG_SMF=y
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_POWEROFF=y
CONFIG_POSIX_API=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_LOG=y

# Stack and heap sizes
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=1024
CONFIG_SHELL_STACK_SIZE=1024
CONFIG_NET_TCP_WORKQ_STACK_SIZE=1024
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Drivers
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_WATCHDOG=y

# GUI
CONFIG_LVGL=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=16

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_DNS_RESOLVER=y
CONFIG_HTTP_CLIENT=y
CONFIG_SNTP=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=24
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=20000
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=60000

# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# TLS sockets
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1

# mbedTLS
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=49152
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y

# Storage / settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Shell
CONFIG_SHELL=y
CONFIG_SETTINGS_SHELL=y
# CONFIG_SHELL_WILDCARD is not set
# CONFIG_SHELL_CMDS is not set
# CONFIG_DATE_SHELL is not set
# CONFIG_DEVICE_SHELL is not set
# CONFIG_DEVMEM_SHELL is not set
# CONFIG_KERNEL_SHELL is not set
