manifest:
  version: 1.2

  self:
    path: departure-board-zephyr

  projects:
    - name: zephyr
      revision: v4.5.0
      url: https://github.com/zephyrproject-rtos/zephyr
      submodules: true
      import:
        path-prefix: zephyrproject
        name-allowlist:
          - zephyr
          - hal_espressif
          - mbedtls
          - tf-psa-crypto
          - lvgl