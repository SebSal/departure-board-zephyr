# Debug log levels, layered over prj.conf:
#   west build -d build -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_APP_CONFIG_LOG_LEVEL_DBG=y
CONFIG_APP_SHELL_LOG_LEVEL_DBG=y
CONFIG_SETTINGS_LOG_LEVEL_DBG=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

CONFIG_MBEDTLS_DEBUG=y

# Very verbose, enable when chasing a network or TLS problem.
#CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
#CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
