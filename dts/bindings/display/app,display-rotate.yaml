description: |
  Presents a monochrome display rotated 90 degrees clockwise.

  The UC8253 panel scans portrait (240 x 416) and has no rotation of its own:
  uc81xx implements no set_orientation, and LVGL cannot rotate for it either,
  because lv_draw_sw_rotate and lv_draw_sw_transform both skip the I1 colour
  format a 1 bit panel forces. So this node sits between LVGL and the panel,
  takes landscape writes and transposes them into the panel's orientation.

  width and height describe the rotated view, so they are the panel's height
  and width swapped.

compatible: "app,display-rotate"

include: display-controller.yaml

properties:
  display:
    type: phandle
    required: true
    description: The panel this node rotates.

  full-refresh-interval:
    type: int
    default: 60
    description: |
      How many refreshes on the panel's partial profile to allow before one is done on its
      full profile instead.

      A fast partial waveform moves only the pixels that changed, which is the point of it,
      but it also never resets the particle distribution the way a full refresh does.
      Ghosting accumulates until something clears it, and this is what clears it. Counted in
      refreshes, not in application cycles: a cycle that redraws the screen more than once
      spends more than one.

      Ignored when the panel has no partial child node, since every refresh is a full one
      already. 0 disables the periodic clear entirely.
